language: java
jdk:
  - openjdk21

before_install:
  - mkdir -p lib
  - wget -O lib/junit-4.13.2.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
  - wget -O lib/hamcrest-core-1.3.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

script:
  - mkdir -p out
  - javac -cp "lib/*" -d out $(find src/main -name "*.java")
  - javac -cp "lib/*:out" -d out $(find src/test -name "*.java")
  - java -cp "out:lib/*" org.junit.runner.JUnitCore com.pearlgifts.inventario.util.PasswordUtilTest